<!-- templates/index.html -->
<!DOCTYPE html>
<html>
<head><title>PDF Summary</title></head>
<body>
  <h1>Upload PDF</h1>
  <form action="/" method="post" enctype="multipart/form-data">
    <input type="file" name="pdf" accept="application/pdf">
    <input type="submit" value="Upload and Summarize">
  </form>

  {% if summary %}
    <h2>Summary:</h2>
    <pre>{{ summary }}</pre>
  {% endif %}
</body>
</html>
